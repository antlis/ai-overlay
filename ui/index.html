<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>invisible-ai</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body { font-family: system-ui, sans-serif; color: #eee; }
      .panel {
        box-sizing: border-box;
        height: 100%;
        padding: 16px 20px;
        border-radius: 14px;
        background: rgba(20, 20, 24, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .panel h1 { margin: 0 0 8px; font-size: 14px; font-weight: 600; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>invisible-ai</h1>
      <p>Overlay — click-through, always on top.</p>
    </div>
  </body>
</html>
