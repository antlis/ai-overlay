# Copy to ~/.config/invisible-ai/config.toml
#
# Any OpenAI-compatible chat-completions API works. The model must accept images.
# The key comes from `api_key_env` if that variable is set, else from `api_key_cmd`.

provider = "nanogpt"

[providers.nanogpt]
base_url = "https://nano-gpt.com/api/v1"
# Subscription models only. Benchmarked 2026-10-17 on screenshot tasks (code bug, dense table):
#   minimax/minimax-latest         correct 3/3, ~2-4 s   <- default
#   inclusionai/ling-3.0-flash-vl  correct 3/3, ~5-7 s
#   xiaomi/mimo-v2.6-flash         correct 3/3, ~10-20 s
#   google/gemma-4-31b-it          fastest (~1-3 s) but misread the dense table
model = "minimax/minimax-latest"
api_key_env = "NANO_GPT_API_KEY"
api_key_cmd = "cat ~/.config/invisible-ai/nanogpt.key"

# OpenCode Zen. Free models (*-free) only work from inside OpenCode itself, so use a paid
# one on the chat-completions endpoint (not the gpt-*, claude-* or gemini-* models).
[providers.zen]
base_url = "https://opencode.ai/zen/v1"
model = "glm-5.3-flash"
api_key_cmd = "jq -r '.opencode.key' ~/.local/share/opencode/auth.json"


[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "google/gemini-3.8-flash"
api_key_env = "OPENROUTER_API_KEY"
api_key_cmd = "jq -r '.openrouter.key' ~/.local/share/opencode/auth.json"

# Local, no key needed beyond a placeholder.
[providers.ollama]
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5vl:7b"
api_key_cmd = "echo ollama"

# Spoken answers (speaker button / invisible-ai speak): local Piper voices, see README.
# These are the defaults; the .onnx.json must sit next to each .onnx.
# [speech]
# en = "~/.local/share/invisible-ai/voices/en_US-lessac-medium.onnx"
# ru = "~/.local/share/invisible-ai/voices/ru_RU-irina-medium.onnx"
# length_scale = 1.0  # < 1 speaks faster, > 1 slower
